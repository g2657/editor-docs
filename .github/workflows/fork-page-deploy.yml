name: Deploy GitHub Pages
# 禁止 on.push：由 Agent 预检通过后 workflow_dispatch，避免写文件就烧 runner
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi
      - name: Build
        run: npm run docs:build

      - name: Set artifact dir
        id: out
        run: echo "dir=docs/.vitepress/dist" >> "$GITHUB_OUTPUT"

      - name: Adapt asset paths for GitHub Pages
        continue-on-error: true
        run: node .github/scripts/fix-pages-base.mjs "${{ steps.out.outputs.dir }}" "/${{ github.event.repository.name }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
